[package]
name = "securechat-backend"
version = "0.1.0"
edition = "2021"
default-run = "securechat-backend"

[dependencies]
axum = { version = "0.7.4", features = ["ws"] }
tokio = { version = "1.36.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5.0", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
base64 = "0.22"
sqlx = { version = "0.8.1", features = ["runtime-tokio", "tls-native-tls", "postgres", "uuid", "chrono"] }
chrono = "0.4"
sha2 = "0.11.0"
redis = { version = "1.7.0", features = ["tokio-comp", "json"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
rcgen = "0.14.10"
aws-config = "1.12.0"
aws-sdk-s3 = "1.149.0"
dotenvy = "0.15.7"
thiserror = "2.0.21"

[profile.dev]
codegen-units = 1
incremental = false
split-debuginfo = "off"

[profile.dev.package."*"]
codegen-units = 1
incremental = false
split-debuginfo = "off"

